# ===========================================================================
# V3 密钥轮换配置：release 包由「旧证书签 v1/v2 + 新证书签 v3 + 轮换链」生成。
#
# 轮换链 signing/lineage 的生成命令：
#   apksigner rotate --out signing/lineage \
#     --old-signer --ks signing/ipuser.jks    --ks-pass pass:<密码> --ks-key-alias ipuser \
#     --new-signer --ks signing/release-v3.jks --ks-pass pass:<密码> --ks-key-alias functionbuilder
#
# 再次轮换（新证书 B 顶替 functionbuilder）：
#   apksigner rotate --in signing/lineage --out signing/lineage2 \
#     --old-signer --ks signing/release-v3.jks --ks-pass pass:<密码> --ks-key-alias functionbuilder \
#     --new-signer --ks signing/next.jks       --ks-pass pass:<密码> --ks-key-alias next
#   然后把下面的 storeFile / lineage 指过去；v1/v2 依旧用最老的 ipuser。
# ===========================================================================
storeFile=signing/release-v3.jks
storePassword=123123
keyAlias=functionbuilder
keyPassword=123123
lineage=signing/lineage
