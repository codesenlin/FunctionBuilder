# ===========================================================================
# V3 密钥轮换配置（APK Signature Scheme v3 的 rotation lineage）
#
# 历史：iApp 导出的 APK 默认用 AOSP 公开的 testkey 签名（CN=Android）。
#       之后用 ipuser 重新签过，所以现在把这条轮换关系正式写进 APK：
#         v1/v2（API < 28）—— AOSP testkey（链上最老的证书）
#         v3（API 28+） —— ipuser（链上最新的证书），并携带 lineage
#       注意：apksigner 需要 --rotation-min-sdk-version 28，否则轮换会被放到
#       API 33+ 的 v3.1 块里，Android 9~12 上仍认成 AOSP。
#
# 轮换链 signing/lineage 的生成命令：
#   apksigner rotate --out signing/lineage \
#     --old-signer --ks signing/aosp-testkey.jks --ks-pass pass:*** --ks-key-alias aosp \
#     --new-signer --ks signing/ipuser.jks       --ks-pass pass:*** --ks-key-alias ipuser
#
# 以后要再换新证书 B：
#   1. apksigner rotate --in signing/lineage --out signing/lineage2 \
#        --old-signer --ks signing/ipuser.jks --ks-pass pass:*** --ks-key-alias ipuser \
#        --new-signer --ks signing/next.jks   --ks-pass pass:*** --ks-key-alias next
#   2. 把下面的 lineage 指向 lineage2，最新签名者改为 signing/keystore.properties 里的 next.jks
#   3. v1/v2 永远用最老的 AOSP，不要动 oldStoreFile
# ===========================================================================

# 最老的签名者：AOSP testkey（签 v1/v2）
oldStoreFile=signing/aosp-testkey.jks
oldStorePassword=123123
oldKeyAlias=aosp
oldKeyPassword=123123

# 轮换链
lineage=signing/lineage
