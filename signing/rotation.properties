# V3 密钥轮换配置：release 包用新密钥签名，并携带 ipuser -> functionbuilder 的轮换链。
# 轮换链 signing/lineage 由 apksigner rotate 生成：
#   apksigner rotate --out signing/lineage \
#     --old-signer --ks signing/ipuser.jks --ks-pass pass:*** --ks-key-alias ipuser \
#     --new-signer --ks signing/release-v3.jks --ks-pass pass:*** --ks-key-alias functionbuilder
storeFile=signing/release-v3.jks
storePassword=123123
keyAlias=functionbuilder
keyPassword=123123
lineage=signing/lineage
